version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: observai-postgres
    environment:
      POSTGRES_DB: observai
      POSTGRES_USER: observai
      POSTGRES_PASSWORD: observai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U observai" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and agent coordination
  redis:
    image: redis:7-alpine
    container_name: observai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # TimescaleDB for metrics storage
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: observai-timescale
    environment:
      POSTGRES_DB: metrics
      POSTGRES_USER: observai
      POSTGRES_PASSWORD: observai
    ports:
      - "5433:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U observai" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Neo4j for Knowledge Graph
  neo4j:
    image: neo4j:5.13-community
    container_name: observai-neo4j
    environment:
      NEO4J_AUTH: neo4j/observai123
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_memory_heap_max__size: 2G
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: [ "CMD", "cypher-shell", "-u", "neo4j", "-p", "observai123", "RETURN 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: observai-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://observai:observai@postgres:5432/observai
      REDIS_URL: redis://redis:6379
      TIMESCALE_URL: postgresql+asyncpg://observai:observai@timescaledb:5432/metrics
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: observai123
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      # Azure Credentials
      AZURE_SUBSCRIPTION_ID: ${AZURE_SUBSCRIPTION_ID}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
    ports:
      - "8000:8000"
    extra_hosts:
      - "ollama.host:172.17.0.1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend (Development Mode)
  frontend:
    image: node:18-alpine
    container_name: observai-frontend
    working_dir: /app
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - VITE_API_URL=http://localhost:8000
    ports:
      - "3000:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - backend

  # OpenTelemetry Collector
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: observai-otel-collector
    command: [ "--config=/etc/otel-collector-config.yaml" ]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
      - "8888:8888" # Prometheus metrics
      - "13133:13133" # Health check
    depends_on:
      - backend

  # Prometheus (optional - for monitoring the platform itself)
  prometheus:
    image: prom/prometheus:latest
    container_name: observai-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  # Grafana (optional - for visualization)
  grafana:
    image: grafana/grafana:latest
    container_name: observai-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-clock-panel
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  timescale_data:
  neo4j_data:
  neo4j_logs:
  prometheus_data:
  grafana_data:


networks:
  default:
    name: observai-network
