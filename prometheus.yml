# Prometheus Configuration

# For monitoring the observability platform itself

global:
scrape_interval: 15s
evaluation_interval: 15s
external_labels:
cluster: ‘observability-platform’
environment: ‘production’

# Alertmanager configuration

alerting:
alertmanagers:
- static_configs:
- targets: []
# - alertmanager:9093

# Load rules once and periodically evaluate them

rule_files:

# - “alerts/*.yml”

# Scrape configurations

scrape_configs:

# Backend API metrics

- job_name: ‘backend’
  static_configs:
  - targets: [‘backend:8000’]
    metrics_path: ‘/metrics’

# Frontend metrics (if exposed)

- job_name: ‘frontend’
  static_configs:
  - targets: [‘frontend:80’]
    metrics_path: ‘/metrics’

# PostgreSQL exporter

- job_name: ‘postgres’
  static_configs:
  - targets: [‘postgres:5432’]

# Redis exporter

- job_name: ‘redis’
  static_configs:
  - targets: [‘redis:6379’]

# Neo4j metrics

- job_name: ‘neo4j’
  static_configs:
  - targets: [‘neo4j:2004’]
    metrics_path: ‘/metrics’

# OpenTelemetry Collector

- job_name: ‘otel-collector’
  static_configs:
  - targets: [‘otel-collector:8888’]

# Prometheus itself

- job_name: ‘prometheus’
  static_configs:
  - targets: [‘localhost:9090’]

# Node exporter (host metrics)

- job_name: ‘node’
  static_configs:
  - targets: []
    
    # - node-exporter:9100

# Storage configuration

storage:
tsdb:
retention.time: 30d
retention.size: 50GB
